name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application and local database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start and reset local Supabase
        run: |
          npx supabase start
          npx supabase db reset

      - name: Configure the local application environment
        run: |
          npx supabase status -o env --override-name api.url=NEXT_PUBLIC_SUPABASE_URL --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY | grep '^NEXT_PUBLIC_SUPABASE_' > .env.local
          echo "APP_URL=http://127.0.0.1:3001" >> .env.local

      - run: npm run check
      - run: npm run build
      - run: npx supabase db lint --local --level error --fail-on error
      - run: npx supabase test db --local

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
